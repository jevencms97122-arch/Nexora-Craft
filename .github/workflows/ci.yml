# Vérifie le code à chaque envoi et à chaque demande de fusion : l'interface compile, le
# typecheck passe et les tests Rust réussissent. Une release ne devrait partir que d'un commit vert.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Typecheck puis compilation de l'interface (le dossier dist est requis par Tauri).
      - run: npm run build

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test
