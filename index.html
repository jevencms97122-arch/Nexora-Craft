<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora Craft</title>
    <style>
      /* Écran de démarrage : affiché tout de suite, avant le chargement de l'interface. */
      html,
      body {
        margin: 0;
        background: #07090c;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #07090c;
        transition: opacity 0.4s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash .splash-bar {
        width: 120px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #splash .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: #f43f4e;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        50% {
          transform: translateY(-6px) scale(1.04);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <svg width="88" height="88" viewBox="0 0 120 120">
        <polygon points="60,8 105,34 60,60 15,34" fill="#ff8f6b" />
        <polygon points="15,34 60,60 60,112 15,86" fill="#f43f4e" />
        <polygon points="60,60 105,34 105,86 60,112" fill="#b81f33" />
        <path d="M39 40h13l17 27V40h12v48H68L51 61v27H39z" fill="#7d1020" transform="translate(4 4)" />
        <path d="M39 40h13l17 27V40h12v48H68L51 61v27H39z" fill="#ffffff" />
      </svg>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
